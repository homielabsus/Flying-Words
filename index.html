<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Type a word, press Enter, watch it fly! WordArt looks + PowerPoint-style moves for kids.">
<title>Flying Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@property --bg1 { syntax: '<color>'; inherits: true; initial-value: #ff7ac6; }
@property --bg2 { syntax: '<color>'; inherits: true; initial-value: #8b5cf6; }
:root {
  --paper: #fff7ec; --ink: #1b1b3a; --sun: #ffd23f; --accent: #ff7ac6;
  --bg1: #ff7ac6; --bg2: #8b5cf6;
  --font: "Fredoka", "Arial Rounded MT Bold", "Segoe UI Black", "Trebuchet MS", system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  padding-inline: 16px; background: var(--paper); color: var(--ink); font-family: var(--font); font-weight: 700;
  -webkit-tap-highlight-color: transparent;

.app { height: 100vh; height: calc(var(--vh, 1vh) * 100); display: flex; flex-direction: column; width: 100%; min-height: 0; }

/* ---------- Stage ---------- */
#stage {
  flex: 1; min-height: 0; position: relative; overflow: hidden; display: grid; place-items: center;
  perspective: 900px; border-radius: 24px; margin-top: 12px; user-select: none; -webkit-user-select: none;
  touch-action: manipulation; contain: layout paint;
  background: radial-gradient(130% 110% at 18% 8%, var(--bg1) 0%, var(--bg2) 100%);
  transition: background 600ms ease, --bg1 600ms ease, --bg2 600ms ease;
  box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .35);
}
#stage::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .85;
  background-image: radial-gradient(#ffffff2e 2px, transparent 2px); background-size: 26px 26px;
}
#stage.dark { background: radial-gradient(90% 80% at 50% 40%, #1a1050 0%, #0b1030 100%); }
#stage.dark::before { opacity: .3; }
#host { position: absolute; inset: 0; width: 100%; height: 100%; display: grid; place-items: center; }
#confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; will-change: transform; z-index: 3; }
#ring { position: absolute; left: 50%; top: 50%; width: 140px; height: 140px; margin: -70px 0 0 -70px; border: 6px solid #fff; border-radius: 50%; opacity: 0; transform: scale(0); pointer-events: none; z-index: 2; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; }

/* sticker badge */
#badge {
  position: absolute; top: 12px; left: 12px; z-index: 5; min-height: 44px; min-width: 44px; max-width: calc(100% - 196px);
  padding: 8px 16px; border-radius: 999px; background: var(--sun); color: var(--ink); border: 3px solid var(--ink);
  box-shadow: 4px 4px 0 var(--ink); font: 800 clamp(14px, 3vw, 20px)/1.15 var(--font); letter-spacing: .01em; text-align: left;
  transform: rotate(-5deg); transform-origin: 50% 50%; cursor: pointer; touch-action: manipulation; white-space: normal;

#badge.pop { animation: badgePop 350ms cubic-bezier(.34, 1.56, .64, 1); }
@keyframes badgePop { 0% { transform: scale(.6) rotate(-12deg); } 60% { transform: scale(1.08); } 100% { transform: scale(1) rotate(-5deg); } }

/* corner cluster */
.corner { position: absolute; top: 12px; right: 12px; z-index: 5; display: flex; gap: 8px; }
.rbtn {
  width: 44px; height: 44px; padding: 0; border-radius: 50%; background: #fff; color: var(--ink); border: 3px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink); font: 700 20px/1 var(--font); display: grid; place-items: center; position: relative;
  cursor: pointer; touch-action: manipulation; transition: transform 80ms, box-shadow 80ms;
}
.rbtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.rbtn.on { background: #b6f36b; }
#lookBtn.pinned::after { content: '📌'; position: absolute; right: -8px; bottom: -8px; font-size: 13px; }
#lookBtn.pop { animation: btnPop 250ms cubic-bezier(.34, 1.56, .64, 1); }
@keyframes btnPop { 0% { transform: scale(.6) rotate(-20deg); } 100% { transform: scale(1) rotate(0); } }
#soundBtn.wiggle { animation: wiggle 400ms ease-in-out; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-16deg) scale(1.1); } 75% { transform: rotate(16deg) scale(1.1); } }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ---------- Dock ---------- */
.dock { flex: none; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }
#f { display: flex; gap: 10px; align-items: center; margin: 0; }
#txt {
  flex: 1; min-width: 0; height: 64px; margin: 0; font: 700 26px/1.2 var(--font); border-radius: 999px; border: 4px solid var(--ink);
  padding: 0 22px; background: #fff; color: var(--ink); outline: none; outline-offset: 3px; -webkit-appearance: none; appearance: none;
  box-shadow: 0 4px 0 rgba(27, 27, 58, .12);

#txt::placeholder { color: #9a98b5; opacity: 1; }
#txt:focus { outline: 4px solid var(--accent); }
#go {
  flex: none; height: 64px; min-width: 100px; padding: 0 22px; background: var(--sun); color: var(--ink); border: 4px solid var(--ink);
  border-radius: 999px; font: 900 26px/1 var(--font); letter-spacing: .02em; box-shadow: 0 6px 0 var(--ink); cursor: pointer;
  touch-action: manipulation; transition: transform 70ms, box-shadow 70ms, filter 120ms;

#go:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
button:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
#chips {
  display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; scrollbar-width: none;
  padding: 10px 2px 6px; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
}
#chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 48px; padding: 0 16px; border-radius: 999px; background: var(--c, #fff); color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font: 800 16px/1 var(--font); white-space: nowrap; cursor: pointer;
  touch-action: manipulation; scroll-snap-align: center; display: inline-flex; align-items: center; gap: 7px;
  transition: transform 70ms, box-shadow 70ms;
}
.chip:active { transform: translateY(3px); box-shadow: none; }
.chip.on { background: var(--ink); color: #fff; box-shadow: 0 3px 0 var(--accent); }
.chip.on:not([data-move="surprise"])::after { content: '📌'; font-size: 13px; }
@media (max-width: 480px) {
  #txt { height: 56px; font-size: 22px; padding: 0 16px; }
  #go { height: 56px; font-size: 22px; padding: 0 16px; }
  .corner { flex-direction: column; }
  #badge { max-width: calc(100% - 88px); padding: 6px 12px; }

/* ---------- The word ---------- */
.line {
  display: inline-block; position: relative; text-align: center; max-width: 100%; font-size: var(--fs, 60px);
  line-height: 1.15; font-weight: 700; letter-spacing: .02em; unicode-bidi: isolate; padding: .3em .35em;
  color: var(--ink); transform-origin: 50% 50%; font-family: var(--font);

.line.oneline { white-space: nowrap; }
.word { display: inline-block; white-space: nowrap; }
.line.breakany .word { white-space: normal; overflow-wrap: anywhere; }
.ch { display: inline-block; position: relative; }
.ch.space { white-space: pre; }
.g { display: inline-block; transform-origin: 50% 50%; }
.line.wc .g { will-change: transform; }
.t { display: inline-block; }
.line.nofx { animation: fadein 500ms ease-out both; }

.sweep { position: absolute; inset-block: 0; left: 0; width: 2em; opacity: 0; pointer-events: none; mix-blend-mode: screen; background: linear-gradient(90deg, transparent, #fff, transparent); }

/* ---------- Looks (static, on .t only) ---------- */
.look-rainbow .t {
  background-image: linear-gradient(90deg, #ff004c, #ff8a00, #ffd400, #3ddc4c, #2fb8ff, #8b5cf6, #ff004c);
  background-size: var(--W, 100%) 100%; background-position: calc(-1 * var(--x, 0px)) 0; background-repeat: repeat;

.look-rainbow .g { filter: drop-shadow(3px 4px 0 rgba(0, 0, 0, .35)); }
.look-candy .t { color: hsl(calc(var(--i, 0) * 360 / var(--n, 1) + var(--h, 0)) 95% 55%); text-shadow: 2px 2px 0 var(--ink), 4px 4px 0 rgba(0, 0, 0, .25); }
.look-chunky3d .t { color: hsl(var(--h, 0) 95% 58%); text-shadow: var(--extrude, none); -webkit-text-stroke: 1px hsl(var(--h, 0) 95% 30%); paint-order: stroke fill; }
.look-bubble { letter-spacing: .05em; }
.look-bubble .t {
  background-image: linear-gradient(180deg, #fff 0 46%, hsl(var(--h, 0) 100% 88%) 46% 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: var(--strokeW, .12em) hsl(var(--h, 0) 90% 42%); paint-order: stroke fill;

.look-bubble .g { filter: drop-shadow(0 .09em 0 hsl(var(--h, 0) 80% 35%)) drop-shadow(0 .16em .1em rgba(0, 0, 0, .25)); }
.look-outline .t {
  color: transparent; -webkit-text-fill-color: transparent; -webkit-text-stroke: max(2px, .07em) var(--ink); paint-order: stroke fill;
  transition: color 450ms ease var(--pd, 0ms), -webkit-text-fill-color 450ms ease var(--pd, 0ms);
}
.look-outline.filled .t { color: hsl(var(--h, 0) 95% 55%); -webkit-text-fill-color: hsl(var(--h, 0) 95% 55%); }
.look-outline.nostroke .t {
  -webkit-text-stroke: 0; color: var(--paper); -webkit-text-fill-color: var(--paper);
  text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink);
}
.look-neon .t { color: #fff; -webkit-text-fill-color: #fff; text-shadow: var(--neon, none); }
.look-metal .t {
  background-image: linear-gradient(180deg, #fff 0%, #dcdcdc 34%, #6f6f6f 50%, #f0f0f0 56%, #9c9c9c 78%, #fff 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1px #4a4a4a; paint-order: stroke fill;
}
.look-metal.gold .t { background-image: linear-gradient(180deg, #fff6c2 0%, #ffd75e 34%, #b8860b 50%, #ffe58a 56%, #c99a2e 78%, #fff6c2 100%); -webkit-text-stroke: 1px #7a5a10; }
.look-metal .g { filter: drop-shadow(2px 3px 2px rgba(0, 0, 0, .45)); }
.look-wavy .t {
  background-image: linear-gradient(180deg, #ffd200, #ff5e00 55%, #ff0077);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
}
.look-wavy .g { filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, .35)); }
/* browsers without background-clip:text get solid fills instead of gradients */
.line.nobg .t { background-image: none !important; color: var(--fb, #fff) !important; -webkit-text-fill-color: var(--fb, #fff) !important; }
/* the single emoji override: emoji keep their real colours, depth/glow comes from the .g filter */
.ch.emo .t { background: none !important; color: initial !important; -webkit-text-fill-color: initial !important; -webkit-text-stroke: 0 !important; text-shadow: none !important; }
.ch.emo .g { filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .35)) drop-shadow(0 0 var(--glowR, 0px) var(--glow, transparent)); }
@media (prefers-reduced-motion: reduce) {
  #badge.pop { animation-duration: 200ms; }
  .line.typing::after { animation: none; }
}
</style>
</head>
<body>

  </div>
  <div class="dock">
    <form id="f" autocomplete="off">
      <input id="txt" type="text" maxlength="200" placeholder="Type a word…" dir="auto" enterkeyhint="go" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Your word">
      <button id="go" type="submit">GO!</button>

  </div>
</div>
<script>

    const superseded = new Promise((res) => ctx.cleanups.push(res));
    await Promise.race([ctx.move.run(ctx), superseded]);
  } catch (e) { /* AbortError and friends: the show must go on */ }
  if (id !== state.seq || !ctx) return;
  try {
    if (ctx.look.afterMove) ctx.look.afterMove(ctx);
    if (isParty) { confetti.stopShower(); confetti.celebrate(ctx.palette, true); if (combo.milestone) confetti.shower(3000, ctx.palette); }
    else if (ctx.move.celebrate) confetti.celebrate(ctx.palette, false);
    startBreathe(ctx);
  } catch (e) { /* ignore */ }
}
function currentText() { return normalize(input.value) || state.lastText || DEMO_WORDS[Math.floor(Math.random() * DEMO_WORDS.length)]; }
function go(text, opts) {
  const t = normalize(text); if (!t) return;
  state.lastText = t;
  const combo = pickCombo(t, opts); state.lastCombo = combo;
  play(t, combo).catch(() => {});
}
function again() { if (state.lastText && state.lastCombo) play(state.lastText, state.lastCombo).catch(() => {}); else go(currentText()); }
function refit() {
  const ctx = state.ctx; if (!ctx || !ctx.alive() || !ctx.line.isConnected) return;
  try { fit(ctx); } catch (e) { /* ignore */ }
}
function relook(look) {
  const ctx = state.ctx;
  if (!ctx || !ctx.alive() || !ctx.line.isConnected) { go(currentText()); return; }
  try {
    swapLook(ctx, look); fit(ctx); void ctx.line.offsetWidth;
    if (state.lastCombo) state.lastCombo.look = look.id;
    setBadge(ctx);
    if (look.afterMove) look.afterMove(ctx);
    if (FEAT.animate) ctx.anim(ctx.line, [{ transform: 'scale(.9)' }, { transform: 'scale(1)' }], { duration: 250, easing: OVERSHOOT, composite: 'add', fill: 'none' });
  } catch (e) { /* ignore */ }
}

/* ---------- UI: chips, buttons, input, gestures ---------- */
function buildChips() {
  const mk = (id, emoji, name, idx) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.move = id; b.dataset.emoji = emoji;
    b.style.setProperty('--c', 'hsl(' + ((idx * 47 + 330) % 360) + ' 100% 88%)');
    const e = document.createElement('span'); e.textContent = emoji; e.setAttribute('aria-hidden', 'true');
    const s = document.createElement('span'); s.textContent = name;
    b.append(e, s); return b;
  };
  chipsEl.append(mk('surprise', '🎲', 'Surprise', 0));
  MOVE_ORDER.forEach((id, k) => chipsEl.append(mk(id, MOVES[id].emoji, MOVES[id].name, k + 1)));
  chipsEl.firstElementChild.classList.add('on');
}
function markChip(id) {
  let sel = null;
  for (const c of chipsEl.children) { const on = c.dataset.move === id; c.classList.toggle('on', on); if (on) sel = c; }
  if (sel) { try { sel.scrollIntoView({ inline: 'nearest', block: 'nearest' }); } catch (e) { /* ignore */ } }
}
function refocus() { if (finePointer()) { try { input.focus({ preventScroll: true }); } catch (e) { /* ignore */ } } }
function keepFocus() {
  try { input.focus({ preventScroll: true }); if (finePointer()) input.select(); } catch (e) { /* ignore */ }
}
let lookCycle = -1; /* position in the look-button cycle; -1 = derive from the look on stage */
function selectMove(id) {
  if (id === 'surprise') clearPins();
  else if (MOVES[id]) state.pinnedMove = id; else return;
  markChip(id);
  go(currentText());
}
let phHold = 0;
function shakeInput() {
  const red = isReduced(), d = red ? 2 : 8;
  if (FEAT.animate) { try { input.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(' + (-d) + 'px)' }, { transform: 'translateX(' + d + 'px)' }, { transform: 'translateX(' + (-d) + 'px)' }, { transform: 'translateX(0)' }], { duration: 350, easing: 'ease-in-out' }); } catch (e) { /* ignore */ } }
  input.placeholder = 'Type ANYTHING! 😄'; phHold = performance.now() + 1500;
  setTimeout(() => { if (input.value === '') input.placeholder = PH[phI]; }, 1500);
}
function submit() {
  const t = normalize(input.value);
  if (!t) { if (state.lastText) go(state.lastText); else shakeInput(); }
  else go(t);
  keepFocus();
}
form.addEventListener('submit', (e) => { e.preventDefault(); submit(); });
input.addEventListener('keydown', (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === 'Escape') { input.value = ''; return; }
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    const cur = state.pinnedMove ? MOVE_ORDER.indexOf(state.pinnedMove) : (state.ctx ? MOVE_ORDER.indexOf(state.ctx.move.id) : -1);
    const next = (cur + (e.key === 'ArrowDown' ? 1 : -1) + MOVE_ORDER.length) % MOVE_ORDER.length;
    selectMove(MOVE_ORDER[next]);
  }
});
chipsEl.addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (!b) return; selectMove(b.dataset.move); refocus(); });
badgeEl.addEventListener('click', () => { clearPins(); markChip('surprise'); go(currentText()); refocus(); });
function clearPins() { state.pinnedMove = null; state.pinnedLook = null; lookCycle = -1; lookBtn.classList.remove('pinned'); }
lookBtn.addEventListener('click', () => {
  const order = LOOK_ORDER.concat([null]);
  const i = lookCycle >= 0 ? lookCycle : order.indexOf(state.ctx ? state.ctx.look.id : LOOK_ORDER[0]);
  lookCycle = (i + 1) % order.length;
  const next = order[lookCycle];
  state.pinnedLook = next; lookBtn.classList.toggle('pinned', !!next);
  const look = LOOKS[next || lookBag.next()];
  relook(look);
  lookBtn.textContent = look.emoji;
  lookBtn.classList.remove('pop'); void lookBtn.offsetWidth; lookBtn.classList.add('pop');
  refocus();
});
function setCalm(on) {
  state.calm = !!on; calmBtn.setAttribute('aria-pressed', String(state.calm)); calmBtn.classList.toggle('on', state.calm);
  if (state.calm && state.breathe) { try { state.breathe.cancel(); } catch (e) { /* ignore */ } state.breathe = null; }
  save('fw.calm', state.calm);
}
function setSound(on) {
  state.sound = !!on; soundBtn.textContent = state.sound ? '🔊' : '🔇'; soundBtn.setAttribute('aria-pressed', String(state.sound)); soundBtn.classList.toggle('on', state.sound);
  soundBtn.classList.remove('wiggle'); void soundBtn.offsetWidth; soundBtn.classList.add('wiggle');
  save('fw.sound', state.sound);
  if (state.sound) { sound.enable(); sound.pop(); }
}
calmBtn.addEventListener('click', () => { setCalm(!state.calm); refocus(); });
soundBtn.addEventListener('click', () => { setSound(!state.sound); refocus(); });
let lastTap = 0;
stage.addEventListener('pointerup', (e) => {
  if (e.target.closest('button')) return;
  const r = stage.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const ch = e.target.closest('.ch');
  if (ch && state.ctx && !ch.classList.contains('space')) {
    const g = ch.querySelector('.g');
    if (g && FEAT.animate) {
      const kf = [{ transform: 'translateY(0)' }, { transform: 'translateY(-.35em) scale(1.15)' }, { transform: 'translateY(0)' }];
      try { g.animate(kf, { duration: 350, easing: 'ease-out', composite: 'add' }); } catch (err) { try { g.animate(kf, { duration: 350, easing: 'ease-out' }); } catch (e2) { /* ignore */ } }
    }
    confetti.burst(x, y, 8, state.ctx.palette, { spread: 360, speed: 260, quiet: true }); sound.pop();
  }
  const now = performance.now();
  if (now - lastTap < 350) { lastTap = 0; again(); } else lastTap = now;
});
stage.addEventListener('mousedown', (e) => { if (!e.target.closest('button')) e.preventDefault(); });

/* placeholder rotation */
const PH = ['Type a word…', 'your name?', '🦖🦖🦖', 'pizza', 'こんにちは', '#1 BEST!'];
let phI = 0;
setInterval(() => { if (input.value !== '' || performance.now() < phHold) return; phI = (phI + 1) % PH.length; input.placeholder = PH[phI]; }, 3000);

/* viewport + resize plumbing (debounced, token-guarded) */
let vhRaf = 0;
function setVH() {
  const h = (FEAT.vv && visualViewport.height) || window.innerHeight;
  if (h) root.style.setProperty('--vh', (h / 100) + 'px');
}
function onViewport() { if (vhRaf) return; vhRaf = requestAnimationFrame(() => { vhRaf = 0; setVH(); confetti.resize(); refit(); }); }
setVH();
window.addEventListener('resize', onViewport);
if (FEAT.vv) { visualViewport.addEventListener('resize', onViewport); visualViewport.addEventListener('scroll', setVH); }
if (FEAT.ro) { try { new ResizeObserver(onViewport).observe(stage); } catch (e) { /* ignore */ } }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(onViewport).catch(() => {});
const onMq = () => { if (isReduced() && state.breathe) { try { state.breathe.cancel(); } catch (e) { /* ignore */ } state.breathe = null; } };
try { if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq); } catch (e) { /* ignore */ }

/* ---------- debug / testing API ---------- */
window.FW = {
  version: 'v1',
  moves: MOVE_ORDER.slice(),
  looks: LOOK_ORDER.slice(),
  split, isEmoji, state,
  play(text, opts) {
    try {
      const t = normalize(text); if (!t) return Promise.resolve();
      const o = opts && typeof opts === 'object' ? opts : {};
      const combo = pickCombo(t, { look: o.look, move: o.move, seed: o.seed, api: true });
      state.lastText = t; state.lastCombo = combo;
      return play(t, combo).catch(() => {});
    } catch (e) { return Promise.resolve(); }
  },
  setReduced(b) { setCalm(!!b); },
  durations: { min: 900, max: 9800 }
};

/* ---------- init ---------- */
buildChips();
setCalm(load('fw.calm', false) === true);
if (load('fw.sound', false) === true) { state.sound = true; soundBtn.textContent = '🔊'; soundBtn.setAttribute('aria-pressed', 'true'); soundBtn.classList.add('on'); }
if (hoverable()) { try { input.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
setTimeout(() => { if (state.seq === 0) go('Hello!'); }, 400);
})();
</script>
