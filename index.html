<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Type a word, press Enter, watch it fly! WordArt looks + PowerPoint-style moves for kids.">
<title>Flying Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@property --bg1 { syntax: '<color>'; inherits: true; initial-value: #ff7ac6; }
@property --bg2 { syntax: '<color>'; inherits: true; initial-value: #8b5cf6; }
:root {
  --paper: #fff7ec; --ink: #1b1b3a; --sun: #ffd23f; --accent: #ff7ac6;
  --bg1: #ff7ac6; --bg2: #8b5cf6;
  --font: "Fredoka", "Arial Rounded MT Bold", "Segoe UI Black", "Trebuchet MS", system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  padding-inline: 16px; color: var(--ink); font-family: var(--font); font-weight: 700;
  background: radial-gradient(circle at 20% 30%, #ff7ac61f 0 3px, transparent 4px) 0 0 / 46px 46px,
    radial-gradient(circle at 70% 75%, #2fb8ff1f 0 3px, transparent 4px) 0 0 / 46px 46px, var(--paper);
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100vh; height: calc(var(--vh, 1vh) * 100); display: flex; flex-direction: column; gap: 10px; width: 100%; min-height: 0;
  padding-block: 12px calc(10px + env(safe-area-inset-bottom));
}

/* ---------- Stage ---------- */
#stage {
  flex: 1; min-height: 0; position: relative; overflow: hidden; display: grid; place-items: center;
  perspective: 900px; border-radius: 24px; user-select: none; -webkit-user-select: none;
  touch-action: manipulation; contain: layout paint;
  background: radial-gradient(130% 110% at 18% 8%, var(--bg1) 0%, var(--bg2) 100%);
  transition: background 600ms ease, --bg1 600ms ease, --bg2 600ms ease;
  box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .35);
}
#stage::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .85;
  background-image: radial-gradient(#ffffff2e 2px, transparent 2px); background-size: 26px 26px;
}
#stage.dark { background: radial-gradient(90% 80% at 50% 40%, #1a1050 0%, #0b1030 100%); }
#stage.dark::before { opacity: .3; }
#host { position: absolute; inset: 0; width: 100%; height: 100%; display: grid; place-items: center; }
#confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; will-change: transform; z-index: 3; }
#ring { position: absolute; left: 50%; top: 50%; width: 140px; height: 140px; margin: -70px 0 0 -70px; border: 6px solid #fff; border-radius: 50%; opacity: 0; transform: scale(0); pointer-events: none; z-index: 2; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; }

/* sticker badge: what is playing right now */
#badge {
  position: absolute; top: 12px; left: 12px; z-index: 5; min-height: 44px; min-width: 44px; max-width: calc(100% - var(--starsW, 160px) - 46px);
  padding: 8px 16px; border-radius: 999px; background: var(--sun); color: var(--ink); border: 3px solid var(--ink);
  box-shadow: 4px 4px 0 var(--ink); font: 800 clamp(14px, 2.4vw, 20px)/1.15 var(--font); letter-spacing: .01em; text-align: left;
  transform: rotate(var(--tilt, -5deg)); transform-origin: 50% 50%; cursor: pointer; touch-action: manipulation; white-space: normal;
}
#badge.pop { animation: badgePop 350ms cubic-bezier(.34, 1.56, .64, 1); }
#badge .bp { display: inline-block; }
/* the halves need two lines: each takes its own and the dot between them goes */
#badge.stacked .bp { display: block; }
#badge.stacked .sep { display: none; }
#badge .sep { margin: 0 .05em; }
#badge .bp.fresh::after {
  content: 'NEW'; margin-left: .35em; padding: 1px 5px 0; border-radius: 7px; background: #ff4fa3; color: var(--ink);
  border: 2px solid var(--ink); font: 900 11px/1 var(--font); letter-spacing: .04em; vertical-align: .2em; white-space: nowrap;
  animation: newTag 500ms ease-out;
}
@keyframes newTag { 0%, 30% { opacity: 0; } 100% { opacity: 1; } }
@keyframes badgePop { 0% { transform: scale(.6) rotate(-12deg); } 60% { transform: scale(1.08); } 100% { transform: scale(1) rotate(var(--tilt, -5deg)); } }

/* ⭐ tricks found: the game's score, top-right of the stage */
#stars {
  position: absolute; top: 12px; right: 12px; z-index: 5; min-height: 44px; padding: 6px 12px 6px 9px;
  display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; background: #fff; color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); font: 800 18px/1 var(--font); transform: rotate(3deg);
  user-select: none; -webkit-user-select: none; cursor: pointer; touch-action: manipulation; margin: 0;
}
#stars:active { box-shadow: 1px 1px 0 var(--ink); translate: 2px 2px; }
#stars:focus-visible { outline: 4px solid #fff; outline-offset: 2px; box-shadow: 4px 4px 0 var(--ink), 0 0 0 9px var(--ink); }
#stars .st { font-size: 21px; line-height: 1; }
#stars .bar { width: 46px; height: 10px; border-radius: 99px; background: #efe9f7; border: 2px solid var(--ink); overflow: hidden; }
#stars .bar i { display: block; height: 100%; width: var(--p, 0%); background: linear-gradient(90deg, #ffd23f, #ff7ac6, #8b5cf6); transition: width 600ms cubic-bezier(.34, 1.56, .64, 1); }
#stars.pop { animation: starPop 650ms cubic-bezier(.34, 1.56, .64, 1); }
@keyframes starPop { 0% { transform: rotate(3deg) scale(1); } 30% { transform: rotate(-8deg) scale(1.28); } 100% { transform: rotate(3deg) scale(1); } }
#stars.done { background: var(--sun); }
/* the trophy's moment. It sits in the bottom band that fit() keeps clear, so it never covers the word */
#toast {
  position: absolute; left: 50%; bottom: 14px; translate: -50% 0; z-index: 6; width: max-content; max-width: calc(100% - 24px);
  padding: 8px 14px; border-radius: 14px; background: #ff4fa3; color: var(--ink); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  font: 900 17px/1.2 var(--font); pointer-events: none; opacity: 0; text-align: center;
}
#toast.show { animation: toastIn 2400ms ease both; }
@keyframes toastIn {
  0% { opacity: 0; transform: translateY(-10px) scale(.8) rotate(-4deg); } 10% { opacity: 1; transform: translateY(0) scale(1.06) rotate(2deg); }
  18% { transform: scale(1) rotate(0); } 82% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(8px); }
}
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ---------- Layout: the play area (stage + word box) and the toy box ---------- */
.play { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; position: relative; }
#f { display: flex; gap: 10px; align-items: center; margin: 0; flex: none; }
#txt {
  flex: 1; min-width: 0; height: 64px; margin: 0; font: 700 26px/1.2 var(--font); border-radius: 999px; border: 4px solid var(--ink);
  padding: 0 22px; background: #fff; color: var(--ink); outline: none; outline-offset: 3px; -webkit-appearance: none; appearance: none;
  box-shadow: 0 4px 0 rgba(27, 27, 58, .12);
}
#txt::placeholder { color: #6f6d90; opacity: 1; }
#txt:focus { outline: 4px solid var(--ink); }
#txt.pulse { animation: txtPulse 260ms ease; }
@keyframes txtPulse { 50% { transform: scale(1.03); } }
#dice {
  flex: none; width: 64px; height: 64px; padding: 0; border-radius: 50%; background: #fff; color: var(--ink); border: 4px solid var(--ink);
  box-shadow: 0 6px 0 var(--ink); font: 700 30px/1 var(--font); display: grid; place-items: center; cursor: pointer;
  touch-action: manipulation; transition: transform 70ms, box-shadow 70ms;
}
#dice:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
#dice.roll span { animation: roll 520ms cubic-bezier(.34, 1.56, .64, 1); }
@keyframes roll { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(200deg) scale(1.25); } 100% { transform: rotate(360deg) scale(1); } }
#dice span { display: inline-block; }
#go {
  flex: none; height: 64px; min-width: 100px; padding: 0 22px; background: var(--sun); color: var(--ink); border: 4px solid var(--ink);
  border-radius: 999px; font: 900 26px/1 var(--font); letter-spacing: .02em; box-shadow: 0 6px 0 var(--ink); cursor: pointer;
  touch-action: manipulation; transition: transform 70ms, box-shadow 70ms, filter 120ms;
}
#go:hover, #dice:hover { filter: brightness(1.06); }
#go:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }

/* first visit only: point at the one thing to do */
#hint {
  position: absolute; left: 14px; bottom: 80px; z-index: 7; padding: 10px 14px; border-radius: 16px; background: #fff; color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); font: 800 17px/1.2 var(--font); pointer-events: none;
  animation: hintBob 1.6s ease-in-out infinite;
}
#hint::after {
  content: ''; position: absolute; left: 34px; bottom: -13px; width: 18px; height: 18px; background: #fff;
  border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg);
}
@keyframes hintBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

/* focus rings must never be the colour of what is behind them: ink on the paper, white + ink halo on the stage */
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
#badge:focus-visible { outline: 4px solid #fff; outline-offset: 2px; box-shadow: 4px 4px 0 var(--ink), 0 0 0 9px var(--ink); }

/* ---------- The toy box ---------- */
#toybox { flex: none; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; --paneH: 116px; }
.tb-head { display: none; }
.tabs { display: flex; gap: 6px; flex: none; }
.tab {
  flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 6px; border-radius: 14px; background: #fff; color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font: 800 15px/1 var(--font); cursor: pointer; position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; touch-action: manipulation;
  transition: transform 70ms, box-shadow 70ms, background 120ms;
}
.tab:active { transform: translateY(3px); box-shadow: none; }
.tab[aria-selected="true"] { background: var(--ink); color: #fff; box-shadow: 0 3px 0 var(--accent); }
.tab .ti { font-size: 18px; }
/* how many NEW things wait behind a tab: a nudge to go and look */
.tab .cnt {
  position: absolute; top: -9px; right: -5px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 99px; background: #ff4fa3;
  color: var(--ink); border: 2px solid var(--ink); font: 900 12px/18px var(--font); text-align: center;
}
.tab .cnt:empty { display: none; }

.pane { display: none; }
#toybox[data-tab="styles"] #pane-styles, #toybox[data-tab="moves"] #chips, #toybox[data-tab="scenes"] #pane-scenes, #toybox[data-tab="show"] #show { display: flex; }
/* emoji are small: two rows of them, flowing sideways */
#toybox[data-tab="emoji"] #pane-emoji {
  display: grid; grid-template-rows: repeat(2, 46px); grid-auto-flow: column; grid-auto-columns: 46px; gap: 6px 8px; align-content: center;
  padding-block: 8px;
}
.tiles {
  gap: 10px; overflow-x: auto; overflow-y: hidden; padding: 11px 8px 9px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain; scroll-snap-type: x proximity; scroll-padding-inline: 8px; flex: none;
  height: var(--paneH); align-items: center;
}
.tiles::-webkit-scrollbar, #show::-webkit-scrollbar { display: none; }

/* Every strip and grid hides its scrollbar, so grabbing it has to work: makeStrip() adds drag and
   wheel, and a faded edge says there is more that way. */
.tiles, #show { cursor: grab; user-select: none; -webkit-user-select: none; }
.tiles.dragging, #show.dragging { cursor: grabbing; scroll-snap-type: none; scroll-behavior: auto; }
.more-l { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 40px); mask-image: linear-gradient(90deg, transparent 0, #000 40px); }
.more-r { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent 100%); mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent 100%); }
.more-l.more-r {
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%);
}
.more-t { -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 36px); mask-image: linear-gradient(180deg, transparent 0, #000 36px); }
.more-b { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 36px), transparent 100%); mask-image: linear-gradient(180deg, #000 calc(100% - 36px), transparent 100%); }
.more-t.more-b {
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 36px, #000 calc(100% - 36px), transparent 100%);
  mask-image: linear-gradient(180deg, transparent 0, #000 36px, #000 calc(100% - 36px), transparent 100%);
}
/* never fade a focus ring out of sight */
.tiles:focus-within, #show:focus-within { -webkit-mask-image: none; mask-image: none; }

/* a tile: one style, one move, or one emoji */
.tile {
  flex: none; width: 88px; height: 94px; padding: 6px 5px 5px; margin: 0; border-radius: 18px; background: var(--c, #fff); color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); font: 800 12.5px/1.1 var(--font); cursor: pointer; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; text-align: center;
  touch-action: manipulation; scroll-snap-align: start; transition: transform 80ms, box-shadow 80ms, background 120ms, color 120ms;
}
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
@media (hover: hover) { .tile:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); } }
.tile .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 100%; }
.tile .emo { display: inline-block; font-size: 33px; line-height: 1.05; }
/* chosen (pinned): ink tile, the pin says it stays */
.tile.on { background: var(--ink); color: #fff; box-shadow: 0 4px 0 var(--accent); }
.tile.on:not(.mix)::after { content: '📌'; position: absolute; top: -10px; right: -8px; font-size: 17px; }
/* on stage right now: sunshine inside an ink ring, readable on white and on paper, so a surprise
   teaches its own name */
.tile.now { box-shadow: 0 0 0 3px var(--sun), 0 0 0 6px var(--ink); }
.tile.wiggle { animation: tileWiggle 650ms ease-in-out 2; }
@keyframes tileWiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-7deg) scale(1.07); } 75% { transform: rotate(7deg) scale(1.07); } }
/* not found yet */
.tile.new::before {
  content: 'NEW'; position: absolute; top: -10px; left: -8px; z-index: 1; padding: 3px 7px; border-radius: 8px; background: #ff4fa3;
  color: var(--ink); border: 2px solid var(--ink); font: 900 12px/1 var(--font); letter-spacing: .04em; transform: rotate(-10deg);
}
/* style swatch: the tile draws "Wow" with the real look's own CSS */
.sw {
  width: 100%; flex: 1 1 auto; min-height: 0; border-radius: 12px; background: #fff; display: grid; place-items: center; overflow: hidden;
  border: 2px solid rgba(27, 27, 58, .16);
}
.sw.dark { background: radial-gradient(90% 80% at 50% 40%, #241a6a 0%, #0b1030 100%); border-color: #0b1030; }
.tile.on .sw { border-color: #fff; }
.tile.style { container-type: inline-size; }
.pv { font-size: 24px; font-size: clamp(15px, 34cqi, 30px); line-height: 1; font-weight: 700; white-space: nowrap; letter-spacing: .02em; font-family: var(--font); }
.pv.look-arch .ch:nth-child(1) { rotate: -24deg; translate: 0 .16em; }
.pv.look-arch .ch:nth-child(3) { rotate: 24deg; translate: 0 .16em; }
.pv.look-wavy .ch:nth-child(1) { translate: 0 .12em; }
.pv.look-wavy .ch:nth-child(2) { translate: 0 -.14em; }
.pv.look-wavy .ch:nth-child(3) { translate: 0 .1em; }
.tile.mix .sw { background: repeating-linear-gradient(45deg, #fff 0 10px, #fff3fb 10px 20px); }
.tile.mix .emo { font-size: 30px; }
/* Mix is a mode, not a pick: when it is on it stays a normal tile with a green tick, so the ink
   "you chose this" tile and the sunshine "on stage now" ring are never out-shouted by it */
.tile.mix.on { background: var(--c, #fff); color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
.tile.mix.on .sw { border-color: rgba(27, 27, 58, .16); }
.tile.mix.on::after {
  content: '✓'; position: absolute; top: -10px; right: -8px; width: 26px; height: 26px; border-radius: 50%; background: #b6f36b;
  color: var(--ink); border: 2px solid var(--ink); font: 900 15px/22px var(--font); text-align: center;
}
/* emoji to add to the word */
.tile.em { width: 46px; height: 46px; border-radius: 14px; padding: 0; gap: 0; box-shadow: 0 3px 0 var(--ink); }
.tile.em .emo { font-size: 26px; }
.tile.em.key { background: #eef4ff; }
.tile.em.key .emo { font-size: 22px; }

/* a move tile's emoji acts the move out when you point at it (and once when you tap) */
@media (hover: hover) { .chip:hover .emo { animation: var(--demo, none) 1s ease-in-out infinite; } }
.chip:focus-visible .emo, .chip.demo .emo { animation: var(--demo, none) 1s ease-in-out 1; }
html.calm .tile .emo { animation: none !important; }
@keyframes dm-fly { 0% { transform: translateX(-26px) rotate(-18deg); opacity: 0; } 60% { transform: translateX(5px) rotate(4deg); opacity: 1; } 100% { transform: none; } }
@keyframes dm-bounce { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-15px) scale(.95, 1.08); } 55% { transform: translateY(0) scale(1.22, .8); } 75% { transform: translateY(-5px); } }
@keyframes dm-zoom { 0% { transform: scale(.2); } 60% { transform: scale(1.4); } 100% { transform: scale(1); } }
@keyframes dm-spin { 0% { transform: rotate(-360deg) scale(.2); } 100% { transform: rotate(0) scale(1); } }
@keyframes dm-wipe { 0% { clip-path: inset(0 100% 0 0); } 70%, 100% { clip-path: inset(0 0 0 0); } }
@keyframes dm-float { 0% { transform: translateY(16px); opacity: 0; } 60% { transform: translateY(-4px) rotate(5deg); opacity: 1; } 100% { transform: none; } }
@keyframes dm-turn { 0% { transform: perspective(200px) rotateY(90deg) scale(.4); } 100% { transform: perspective(200px) rotateY(0) scale(1); } }
@keyframes dm-swivel { 0% { transform: perspective(200px) rotateY(0); } 100% { transform: perspective(200px) rotateY(360deg); } }
@keyframes dm-type { 0%, 30% { clip-path: inset(0 100% 0 0); } 31%, 55% { clip-path: inset(0 50% 0 0); } 56%, 100% { clip-path: inset(0 0 0 0); } }
@keyframes dm-rain { 0% { transform: translateY(-24px) rotate(-30deg); opacity: 0; } 70% { transform: translateY(2px) scale(1.12, .88); opacity: 1; } 100% { transform: none; } }
@keyframes dm-pulse { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.22); } 30% { transform: scale(1); } 45% { transform: scale(1.28); } }
@keyframes dm-teeter { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-17deg); } 75% { transform: rotate(17deg); } }
@keyframes dm-wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px) scale(1.08); } }
@keyframes dm-disco { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
@keyframes dm-cart { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
@keyframes dm-bigtiny { 0%, 100% { transform: scale(1); } 35% { transform: scale(1.5); } 65% { transform: scale(.45); } }
@keyframes dm-jelly { 0%, 100% { transform: scale(1, 1); } 25% { transform: scale(1.3, .7); } 50% { transform: scale(.75, 1.3); } 75% { transform: scale(1.15, .85); } }
@keyframes dm-shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px) rotate(-5deg); } 40%, 80% { transform: translateX(5px) rotate(5deg); } }
@keyframes dm-blast { 0% { transform: none; } 12% { transform: translateX(-2px); } 24% { transform: translateX(2px); } 58% { transform: translateY(-34px) scale(.6); opacity: 0; } 59% { transform: translateY(12px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes dm-shatter { 0%, 100% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.8) rotate(24deg); opacity: 0; } 60% { transform: scale(.3); opacity: 0; } }
@keyframes dm-fall { 0% { transform: none; } 50% { transform: translateY(22px) rotate(80deg); opacity: 0; } 51% { transform: translateY(-10px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes dm-party { 0% { transform: rotate(0) scale(1); filter: hue-rotate(0deg); } 50% { transform: rotate(180deg) scale(1.3); } 100% { transform: rotate(360deg) scale(1); filter: hue-rotate(360deg); } }
@keyframes dm-dice { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
@keyframes dm-hop { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-6px, -14px); } 50% { transform: translate(-3px, 0) scale(1.12, .88); } 75% { transform: translate(0, -9px); } }
@keyframes dm-tornado { 0% { transform: rotate(0) scale(.3); } 70% { transform: rotate(600deg) scale(1.1); } 100% { transform: rotate(720deg) scale(1); } }
@keyframes dm-slither { 0% { transform: translate(-20px, 0) rotate(-20deg); } 25% { transform: translate(-10px, -6px) rotate(15deg); } 50% { transform: translate(0, 6px) rotate(-12deg); } 75% { transform: translate(6px, -3px) rotate(8deg); } 100% { transform: none; } }
@keyframes dm-magnet { 0%, 55% { transform: translate(14px, -10px) rotate(30deg) scale(.8); } 85% { transform: translate(-2px, 1px) scale(1.12); } 100% { transform: none; } }
@keyframes dm-yoyo { 0% { transform: translateY(-20px); } 40% { transform: translateY(6px) scale(.92, 1.1); } 60% { transform: translateY(-5px); } 80% { transform: translateY(2px); } 100% { transform: none; } }
@keyframes dm-race { 0% { transform: translateX(26px) skewX(-25deg); opacity: 0; } 20% { opacity: 1; } 70% { transform: translateX(-4px) skewX(15deg); } 100% { transform: none; } }

/* ---------- The show: auto play, shuffle, interval, sound, calm ---------- */
#show {
  gap: 8px; align-items: center; align-content: center; flex-wrap: wrap; padding: 4px 8px; flex: none; height: var(--paneH);
  overflow-x: hidden; overflow-y: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}
.pill {
  flex: none; min-height: 48px; padding: 0 16px; border-radius: 999px; background: #fff; color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font: 800 16px/1 var(--font); white-space: nowrap;
  cursor: pointer; touch-action: manipulation; display: inline-flex; align-items: center; gap: 7px; position: relative;
  transition: transform 70ms, box-shadow 70ms, background 120ms;
}
.pill:active { transform: translateY(3px); box-shadow: none; }
#playBtn.on { background: var(--sun); }
#shufBtn.on { background: #b6f36b; }
#soundBtn.on, #calmBtn.on { background: #b6f36b; }
#soundBtn.wiggle .ico { display: inline-block; animation: wiggle 400ms ease-in-out; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-16deg) scale(1.15); } 75% { transform: rotate(16deg) scale(1.15); } }
/* the dot blinks while the show is running so it is obvious the page is driving itself */
#playBtn.on .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); animation: blip 1.1s ease-in-out infinite; }
#playBtn .dot { display: none; }
@keyframes blip { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .25; transform: scale(.7); } }
html.calm #playBtn.on .dot { animation: none; opacity: 1; }
/* the whole ⏱ pill opens the menu: the <select> is its only in-flow child and carries all the padding */
.pill.sel { padding: 0; gap: 0; }
.pill.sel .ico { position: absolute; left: 12px; pointer-events: none; }
.pill.sel::after { content: '▾'; position: absolute; right: 12px; pointer-events: none; font-size: 15px; }
#every {
  appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: inherit;
  align-self: stretch; min-height: 44px; border-radius: 999px;
  font: 800 16px/1 var(--font); padding: 0 28px 0 36px; margin: -3px; cursor: pointer;
}
#every:focus-visible { outline: 4px solid var(--ink); outline-offset: 2px; }
@supports selector(:has(*)) {
  #every:focus-visible { outline: none; }
  .pill.sel:has(#every:focus-visible) { outline: 4px solid var(--ink); outline-offset: 3px; }
}

/* ---------- Phones ---------- */
@media (max-width: 480px) {
  #txt { height: 56px; font-size: 22px; padding: 0 16px; }
  #go { height: 56px; min-width: 84px; font-size: 22px; padding: 0 14px; }
  #dice { width: 56px; height: 56px; font-size: 26px; }
  #hint { bottom: 70px; font-size: 16px; }
  #badge { max-width: calc(100% - var(--starsW, 100px) - 40px); padding: 6px 12px; }
  #stars { padding: 5px 10px 5px 6px; gap: 5px; font-size: 16px; }
  #stars .bar { display: none; }
  /* no room for the bar: the star wears its progress as a ring instead */
  #stars .st {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; font-size: 16px;
    background: radial-gradient(closest-side, #fff 70%, transparent 72%), conic-gradient(#ffb300 var(--p, 0%), #e6ddf5 0);
  }
  #toast { font-size: 15px; }
  #txt::placeholder { font-size: 18px; }
  .tab { font-size: 13px; padding: 0 4px; gap: 3px; }
  .tab .ti { font-size: 17px; }
  #show { gap: 6px; }
  .pill { padding: 0 11px; font-size: 15px; gap: 5px; }
  #every { font-size: 15px; padding: 0 24px 0 33px; }
  .pill.sel .ico { left: 10px; }
  .pill.sel::after { right: 10px; }
}
@media (max-width: 360px) {
  .tab { flex-direction: column; gap: 1px; font-size: 11px; min-height: 52px; padding: 2px; }
  .tab .ti { font-size: 19px; }
}
/* tablets standing up: two rows of tiles, so most of the toys are in view at once */
@media (min-width: 600px) and (max-width: 899px) and (min-height: 800px) {
  #toybox { --paneH: 224px; }
  #toybox[data-tab="styles"] #pane-styles, #toybox[data-tab="moves"] #chips, #toybox[data-tab="scenes"] #pane-scenes {
    display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, 94px); grid-auto-columns: 88px; align-content: center; gap: 12px 10px;
  }
  #toybox[data-tab="emoji"] #pane-emoji { grid-template-rows: repeat(3, 50px); grid-auto-columns: 50px; gap: 10px; }
  .tile.em { width: 50px; height: 50px; }
}
/* short visible screens (a phone with its keyboard open): keep the stage, shrink the box. html.short
   is set from the VISUAL viewport in setVH(): phones that open a keyboard over the page leave the
   layout viewport alone, so a max-height media query would never notice. */
html.short #toybox { --paneH: 88px; }
html.short #toybox[data-tab="styles"] #pane-styles, html.short #toybox[data-tab="moves"] #chips, html.short #toybox[data-tab="scenes"] #pane-scenes { display: flex; }
html.short #toybox[data-tab="emoji"] #pane-emoji { grid-template-rows: 54px; grid-auto-columns: 54px; padding-block: 9px 7px; }
html.short #show { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; padding-block: 8px 6px; }
html.short .tile { width: 70px; height: 70px; padding: 4px; }
html.short .tile .nm { display: none; }
html.short .tile .emo { font-size: 30px; }
html.short .tile.em { width: 54px; height: 54px; }
html.short .tiles { padding-block: 9px 7px; }
html.short #hint { display: none; }

/* ---------- Wide screens: the toy box becomes a side panel of grids ---------- */
@media (min-width: 900px) and (min-height: 540px) {
  .app { flex-direction: row; gap: 18px; }
  #toybox {
    width: clamp(330px, 31vw, 410px); background: #fff; border: 3px solid var(--ink); border-radius: 26px;
    box-shadow: 6px 6px 0 var(--ink); padding: 14px 14px 12px; gap: 10px;
  }
  .tb-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px 2px; flex: none; }
  .tb-head .logo { font-size: 30px; line-height: 1.05; white-space: nowrap; }
  .tb-head .sub { font: 800 13px/1.2 var(--font); color: #6f6d90; text-align: right; }
  .tab[data-tab="show"] { display: none; }
  .tab { font-size: 15px; }
  /* the show controls are always in view on a wide screen, docked under the grids */
  #toybox #show { display: flex; flex-wrap: wrap; overflow: visible; padding: 10px 0 0; border-top: 3px dashed #e3dcef; order: 9; height: auto; }
  #toybox .pane.tiles { display: none; }
  #toybox[data-tab="styles"] #pane-styles, #toybox[data-tab="show"] #pane-styles,
  #toybox[data-tab="moves"] #chips, #toybox[data-tab="scenes"] #pane-scenes, #toybox[data-tab="emoji"] #pane-emoji {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: max-content; align-content: start;
    gap: 12px; flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
    scroll-snap-type: none; padding: 12px 8px 10px; height: auto; grid-auto-flow: row; grid-template-rows: none; grid-auto-columns: auto;
  }
  #toybox[data-tab="emoji"] #pane-emoji { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .tile { width: auto; height: auto; aspect-ratio: 1 / 1.02; min-height: 0; font-size: 13.5px; }
  .tile .emo { font-size: 38px; }
  .tile.em { width: auto; height: auto; aspect-ratio: 1; border-radius: 16px; }
  .tile.em .emo { font-size: 30px; }
  .tile.chip { aspect-ratio: auto; min-height: 96px; container-type: inline-size; }
  .tile.chip .nm { font-size: clamp(11px, 17cqi, 13.5px); }
  #hint { bottom: 86px; }
}
@media (min-width: 900px) and (min-height: 540px) and (max-width: 1100px) {
  .tb-head .sub { display: none; }
  #soundBtn .lbl, #calmBtn .lbl { display: none; }
  #soundBtn, #calmBtn { padding: 0 12px; }
}

@media (prefers-reduced-motion: reduce) {
  #badge.pop, #stars.pop { animation-duration: 200ms; }
  #hint { animation: none; }
  .tile .emo { animation: none !important; }
  #toast.show { animation-duration: 3200ms; }
  #dice.roll span { animation: none; }
  .tile.wiggle, #badge .bp.fresh::after { animation: none; }
}
/* 🐢 Calm is the same promise as the system's reduce-motion setting, so it stills the same things */
html.calm #badge.pop, html.calm #stars.pop { animation-duration: 200ms; }
html.calm #toast.show { animation-duration: 3200ms; }
html.calm #hint, html.calm #dice.roll span, html.calm .tile.wiggle, html.calm #badge .bp.fresh::after,
html.calm #soundBtn.wiggle .ico, html.calm .line.typing::after { animation: none; }

/* ---------- The word ---------- */
.line {
  display: inline-block; position: relative; text-align: center; max-width: 100%; font-size: var(--fs, 60px);
  line-height: 1.15; font-weight: 700; letter-spacing: .02em; unicode-bidi: isolate; padding: .3em .35em;
  color: var(--ink); transform-origin: 50% 50%; font-family: var(--font);
}
.line.oneline { white-space: nowrap; }
.word { display: inline-block; white-space: nowrap; }
.line.breakany .word { white-space: normal; overflow-wrap: anywhere; }
.ch { display: inline-block; position: relative; }
.ch.space { white-space: pre; }
.g { display: inline-block; transform-origin: 50% 50%; }
.line.wc .g { will-change: transform; }
.t { display: inline-block; }
.line.nofx { animation: fadein 500ms ease-out both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.sweep { position: absolute; inset-block: 0; left: 0; width: 2em; opacity: 0; pointer-events: none; mix-blend-mode: screen; background: linear-gradient(90deg, transparent, #fff, transparent); }
.sweep.v { left: 0; right: 0; width: auto; top: 0; bottom: auto; height: 2em; background: linear-gradient(180deg, transparent, #fff, transparent); }
/* the caret is absolutely positioned so it adds no width: an inline ::after would re-centre the whole
   (centred) line the moment the class is removed, snapping the finished word sideways */
.line.typing::after { content: '▍'; position: absolute; inset-inline-start: 100%; bottom: .3em; color: var(--ink); -webkit-text-fill-color: var(--ink); animation: blink 900ms steps(2, jump-none) infinite; }
.dark .line.typing::after { color: #fff; -webkit-text-fill-color: #fff; }
@keyframes blink { from { opacity: 1; } to { opacity: 0; } }

/* ---------- Looks (static, on .t only) ---------- */
.look-rainbow .t {
  background-image: linear-gradient(90deg, #ff004c, #ff8a00, #ffd400, #3ddc4c, #2fb8ff, #8b5cf6, #ff004c);
  background-size: var(--W, 100%) 100%; background-position: calc(-1 * var(--x, 0px)) 0; background-repeat: repeat;
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
}
.look-rainbow .g { filter: drop-shadow(3px 4px 0 rgba(0, 0, 0, .35)); }
.look-candy .t { color: hsl(calc(var(--i, 0) * 360 / var(--n, 1) + var(--h, 0)) 95% 55%); text-shadow: 2px 2px 0 var(--ink), 4px 4px 0 rgba(0, 0, 0, .25); }
.look-chunky3d .t { color: hsl(var(--h, 0) 95% 58%); text-shadow: var(--extrude, none); -webkit-text-stroke: 1px hsl(var(--h, 0) 95% 30%); paint-order: stroke fill; }
.look-bubble { letter-spacing: .05em; }
.look-bubble .t {
  background-image: linear-gradient(180deg, #fff 0 46%, hsl(var(--h, 0) 100% 88%) 46% 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: var(--strokeW, .12em) hsl(var(--h, 0) 90% 42%); paint-order: stroke fill;
}
.look-bubble .g { filter: drop-shadow(0 .09em 0 hsl(var(--h, 0) 80% 35%)) drop-shadow(0 .16em .1em rgba(0, 0, 0, .25)); }
/* -webkit-text-fill-color is NOT transitionable in Chromium (it snaps at t=0) and it wins over color,
   so the pour is driven by `color` alone and text-fill-color is left at its initial `currentcolor`. */
.look-outline .t {
  color: transparent; -webkit-text-stroke: max(2px, .07em) var(--ink); paint-order: stroke fill;
  transition: color 450ms ease var(--pd, 0ms);
}
.look-outline.nostroke .t {
  -webkit-text-stroke: 0; color: var(--paper);
  text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink);
}
/* declared last so the pour also wins in the no-text-stroke fallback (equal specificity) */
.look-outline.filled .t, .look-outline.nostroke.filled .t { color: hsl(var(--h, 0) 95% 55%); }
.look-neon .t { color: #fff; -webkit-text-fill-color: #fff; text-shadow: var(--neon, none); }
.look-metal .t {
  background-image: linear-gradient(180deg, #fff 0%, #dcdcdc 34%, #6f6f6f 50%, #f0f0f0 56%, #9c9c9c 78%, #fff 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1px #4a4a4a; paint-order: stroke fill;
}
.look-metal.gold .t { background-image: linear-gradient(180deg, #fff6c2 0%, #ffd75e 34%, #b8860b 50%, #ffe58a 56%, #c99a2e 78%, #fff6c2 100%); -webkit-text-stroke: 1px #7a5a10; }
.look-metal .g { filter: drop-shadow(2px 3px 2px rgba(0, 0, 0, .45)); }
.look-wavy .t {
  background-image: linear-gradient(180deg, #ffd200, #ff5e00 55%, #ff0077);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
}
.look-wavy .g { filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, .35)); }
/* more styles (the exporter paints the same numbers on a canvas, so keep the two in step) */
.look-unicorn .t {
  background-image: linear-gradient(90deg, #ff8fd0, #c79bff, #8fd3ff, #8ff0c8, #ffe58f, #ff8fd0);
  background-size: var(--W, 100%) 100%; background-position: calc(-1 * var(--x, 0px)) 0; background-repeat: repeat;
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: var(--strokeW, .1em) #fff; paint-order: stroke fill;
}
.look-unicorn .g { filter: drop-shadow(0 .05em 0 #e07bc0) drop-shadow(0 .1em .08em rgba(120, 60, 160, .35)); }
.look-lollipop .t {
  background-image: repeating-linear-gradient(-45deg, hsl(var(--h, 0) 95% 58%) 0 .14em, #fff .14em .28em);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: var(--strokeW, .05em) hsl(var(--h, 0) 85% 32%); paint-order: stroke fill;
}
.look-lollipop .g { filter: drop-shadow(.04em .06em 0 hsl(var(--h, 0) 85% 22%)); }
.look-glitter .t {
  background-image: var(--glitterImg, none), linear-gradient(180deg, #ffd1f0, #ff5fb8 45%, #b14bff);
  background-size: .9em .9em, 100% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: var(--strokeW, .05em) #fff; paint-order: stroke fill;
}
.look-glitter .g { filter: drop-shadow(0 0 .08em rgba(255, 255, 255, .9)) drop-shadow(.03em .06em 0 #8a2bbf); }
.look-fire .t {
  background-image: linear-gradient(180deg, #ff2d00 0%, #ff8a00 45%, #ffe14a 85%, #fff6c8 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: var(--strokeW, .03em) #a51b00; paint-order: stroke fill;
}
.look-fire .g { filter: drop-shadow(0 -.04em .12em #ff6a00) drop-shadow(0 0 .05em #ffb300); }
.look-ice .t {
  background-image: linear-gradient(180deg, #ffffff 0%, #d6f6ff 38%, #7fd6ff 62%, #3aa6f0 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: var(--strokeW, .04em) #1c6fc4; paint-order: stroke fill;
}
.look-ice .g { filter: drop-shadow(0 0 .1em rgba(180, 240, 255, .95)) drop-shadow(.03em .05em 0 #145a9e); }
.look-galaxy .t {
  background-image: var(--starsImg, none), linear-gradient(135deg, #1b0b4a 0%, #4a1aa0 40%, #c03bb5 75%, #ff7ad9 100%);
  background-size: 1.1em 1.1em, 100% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: var(--strokeW, .03em) #e9d8ff; paint-order: stroke fill;
}
.look-galaxy .g { filter: drop-shadow(0 0 .12em rgba(170, 120, 255, .8)); }
.look-comic .t {
  color: #ffe14d; -webkit-text-fill-color: #ffe14d; -webkit-text-stroke: .12em var(--ink); paint-order: stroke fill;
  text-shadow: .07em .07em 0 #ff3b3b, .1em .1em 0 var(--ink);
}
.look-balloon .t {
  --bh: calc(var(--i, 0) * 360 / var(--n, 1) + var(--h, 0));
  background-image: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .95) 0 .07em, rgba(255, 255, 255, 0) .22em),
    linear-gradient(180deg, hsl(var(--bh) 95% 66%), hsl(var(--bh) 90% 46%));
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: var(--strokeW, .03em) hsl(var(--bh) 80% 30%); paint-order: stroke fill;
}
.look-balloon .g { filter: drop-shadow(.03em .08em .04em rgba(0, 0, 0, .3)); }
.look-sprinkles .t {
  background-image: var(--sprinklesImg, none), linear-gradient(180deg, #ffc1e3, #ff7ac6);
  background-size: 1em 1em, 100% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: var(--strokeW, .08em) #6b3a1e; paint-order: stroke fill;
}
.look-sprinkles .g { filter: drop-shadow(.03em .06em 0 #3d1f0d); }
/* eight more: animal coats, snacks and a film title (painted the same way by the exporter) */
.look-tiger .t {

/* browsers without background-clip:text get solid fills instead of gradients */

/* ---------- Scenes: a world behind the word ---------- */

/* a 3D scene says so in the corner of its tile */

.tile.scene.three .sw::after {
  content: '3D'; position: absolute; right: 3px; bottom: 3px; padding: 2px 4px 1px; border-radius: 7px; background: var(--sun); color: var(--ink);

.tile.cam.on::after { content: '●'; color: #ff4d6d; background: #fff; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); font: 900 14px/18px var(--font); top: -9px; right: -7px; }
/* one grid cell: a strip tile keeps its own size, a grid tile fills its column */

/* each shape draws itself: a little box in its own proportions, centred in the same 26px square */
.kr {

/* ---------- ⛶ full screen ---------- */
#fsBtn, #fsPlay {
  position: absolute; left: 12px; bottom: 12px; z-index: 5; width: 54px; height: 54px; padding: 0; border-radius: 50%;
  background: #fff; color: var(--ink); border: 3px solid var(--ink); box-shadow: 3px 4px 0 var(--ink); font: 700 24px/1 var(--font);
  display: grid; place-items: center; cursor: pointer; touch-action: manipulation; transform: rotate(6deg); transition: transform 90ms;
}
#fsPlay { left: 78px; transform: rotate(-4deg); }
#fsBtn svg { width: 26px; height: 26px; }
#fsBtn .fs-out, html.fs #fsBtn .fs-in { display: none; }

@media (hover: hover) { #fsBtn:hover { transform: rotate(-4deg) scale(1.07); } #fsPlay:hover { transform: rotate(4deg) scale(1.07); } }

/* the first-visit hint points at the word box, right where the button sits: the button waits until it has gone */
.play:has(#hint:not([hidden])) #fsBtn { visibility: hidden; }

/* in full screen the stage is the whole screen; the word box floats on it and the toy box steps aside */
html.fs body { padding-inline: 0; }
html.fs .app { padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); gap: 0; }

html.fs #f {
  position: absolute; left: 50%; bottom: 78px; translate: -50% 0; z-index: 6; width: min(640px, calc(100% - 32px));
  padding: 8px; border-radius: 999px; background: rgba(255, 255, 255, .55); box-shadow: 0 6px 24px rgba(27, 27, 58, .25);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}

html.fs.short #toast { bottom: 60px; }
html.fs #f, html.fs #fsBtn, html.fs #fsPlay, html.fs #keepBtn, html.fs #badge, html.fs #stars { transition: opacity 350ms ease, transform 90ms; }
/* three quiet seconds: only the show is left */
html.fs.fs-idle #fsBtn, html.fs.fs-idle #fsPlay, html.fs.fs-idle #keepBtn, html.fs.fs-idle #badge, html.fs.fs-idle #stars { opacity: 0; pointer-events: none; }
html.fs.fs-idle #stage { cursor: none; }
/* the word box keeps its own time: away as full screen starts, back for a tap or a key, and it waits 30 seconds after typing */
html.fs.fs-nofield #f { opacity: 0; pointer-events: none; }
/* ---------- ✂️ the photo booth: the kid cut out of the camera picture, standing in the scene ---------- */
#me { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
#stage.has-me #me { display: block; }
#stage.cam:not(.booth) #me { display: none; }

#stage.cam.booth #camVid { opacity: 0; }
#stage.cam.booth.scened #scene { display: block; }
#stage.cam.booth:not(.scened)::before { display: block; }
#boothBar { position: absolute; left: 50%; bottom: 88px; translate: -50% 0; z-index: 6; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 12px); }
.booth-b {

  box-shadow: 0 3px 0 var(--ink); font: 800 15px/1 var(--font); white-space: nowrap; cursor: pointer; touch-action: manipulation;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;

.booth-b:active { transform: translateY(3px); box-shadow: none; }

.booth-b.busy { border-style: dashed; animation: boothBusy 700ms ease-in-out infinite alternate; }
@keyframes boothBusy { to { background: var(--sun); } }
html.calm .booth-b.busy { animation: none; }
@media (prefers-reduced-motion: reduce) { .booth-b.busy { animation: none; } }
.booth-b:focus-visible { outline: 4px solid #fff; outline-offset: 2px; }

/* a cut-out says so on its tile, and lies on a checked cloth so the see-through part shows */
.tile.cutout .sw { position: relative; background: repeating-conic-gradient(#dfe4f2 0 25%, #fff 0 50%) 0 0 / 14px 14px; }
.tile.cutout .sw::after { content: '✂️'; position: absolute; right: 2px; bottom: 1px; font-size: 14px; line-height: 1; }

/* a band of sea: a wavy top edge, filled down to the bottom, with a line of foam along the top */
function waves(c, w, h, y, amp, len, ph, col, foam) {
  const step = len / 12, yAt = (x) => y + Math.sin(x / len * TAU + ph) * amp;
  c.beginPath(); c.moveTo(0, h); for (let x = 0; x <= w + step; x += step) c.lineTo(x, yAt(x)); c.lineTo(w, h); c.closePath(); c.fillStyle = col; c.fill();
  if (foam) { c.strokeStyle = foam; c.lineWidth = Math.max(1, amp * .45); c.beginPath(); for (let x = 0; x <= w + step; x += step) { if (x) c.lineTo(x, yAt(x)); else c.moveTo(x, yAt(x)); } c.stroke(); }
}
